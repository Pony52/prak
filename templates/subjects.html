{% extends "base.html" %}

{% block title %}Дисциплины{% endblock %}

{% block content %}
<h2>Справочник дисциплин</h2>

<div class="form-block">
    <h3>Добавить дисциплину</h3>
    <input type="text" id="subject-name" placeholder="Название (Информатика)">
    <input type="text" id="subject-short" placeholder="Сокращённо (ИНФ)">
    <button onclick="addSubject()">Добавить</button>
</div>

<table id="subjects-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Сокращённо</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
async function loadSubjects() {
    const res = await fetch('/api/subjects');
    const subjects = await res.json();
    const tbody = document.querySelector('#subjects-table tbody');
    tbody.innerHTML = '';
    subjects.forEach(s => {
        tbody.innerHTML += `
            <tr>
                <td>${s.id}</td>
                <td>${s.name}</td>
                <td>${s.short_name || ''}</td>
                <td><button onclick="deleteSubject(${s.id})">Удалить</button></td>
            </tr>`;
    });
}

async function addSubject() {
    const name = document.getElementById('subject-name').value;
    const short_name = document.getElementById('subject-short').value;

    if (!name) { alert('Введите название'); return; }

    await fetch('/api/subjects', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, short_name})
    });

    document.getElementById('subject-name').value = '';
    document.getElementById('subject-short').value = '';
    loadSubjects();
}

async function deleteSubject(id) {
    if (!confirm('Удалить дисциплину?')) return;
    await fetch(`/api/subjects/${id}`, {method: 'DELETE'});
    loadSubjects();
}

loadSubjects();
</script>
{% endblock %}
